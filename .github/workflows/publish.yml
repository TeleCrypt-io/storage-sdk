name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: storage-sdk-publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_PARAMETERS: ""
  GIT_NO_REPLACE_OBJECTS: "1"
  GIT_TERMINAL_PROMPT: "0"
  GIT_ASKPASS: /bin/false
  SSH_ASKPASS: /bin/false
  GIT_ALLOW_PROTOCOL: https
  GIT_PROTOCOL_FROM_USER: "0"
  GH_HOST: github.com
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read}
    outputs:
      archive_digest: ${{ steps.package.outputs.archive_digest }}
      archive_size: ${{ steps.package.outputs.archive_size }}
      record_digest: ${{ steps.package.outputs.record_digest }}
      record_size: ${{ steps.package.outputs.record_size }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify exact annotated source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          if test "$config_status" != 0 -a "$config_status" != 1; then cat "$config_file"; exit "$config_status"; fi
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key"
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          timeout --signal=TERM --kill-after=5s 60s git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
      - uses: actions/setup-node@v7.0.0
        with: {node-version: "24.20.0", cache: npm}
      - name: Verify toolchain and package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          test "$(npm --version)" = 11.19.0
          expected="${RELEASE_TAG#v}"
          EXPECTED="$expected" node -e 'const f=require("fs"),p=JSON.parse(f.readFileSync("package.json")),l=JSON.parse(f.readFileSync("package-lock.json")); if(p.name!=="@telecrypt-io/storage"||p.version!==process.env.EXPECTED||l.name!==p.name||l.lockfileVersion!==3||l.packages?.[""].version!==process.env.EXPECTED)process.exit(1)'
      - name: Test and build the release source
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 600s npm ci --ignore-scripts --no-fund --no-audit
          timeout --signal=TERM --kill-after=5s 300s npm run lint
          timeout --signal=TERM --kill-after=5s 600s npm run test:unit
          timeout --signal=TERM --kill-after=5s 300s npm run build
      - name: Package the exact tested archive
        id: package
        shell: bash
        run: |
          # shellcheck disable=SC2097,SC2098,SC2016
          set -euo pipefail
          mkdir -p release
          timeout --signal=TERM --kill-after=5s 300s npm pack --ignore-scripts --pack-destination release
          mapfile -t archives < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#archives[@]}" = 1
          archive="release/${RELEASE_TAG}.tgz"
          mv "${archives[0]}" "$archive"
          package_files=".github/package-files.txt"
          test -f "$package_files"
          test "$(tar -tzf "$archive" | sort)" = "$(sort "$package_files")"
          if tar -tzf "$archive" | grep -Eq '(^|/)node_modules(/|$)'; then exit 1; fi
          test "$(tar -xOf "$archive" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')" = "${RELEASE_TAG#v}"
          size="$(wc -c <"$archive")"
          test "$size" -gt 0 -a "$size" -le 134217728
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          archive_sha512="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto"); process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$archive")"
          # shellcheck disable=SC2097,SC2098,SC2016
          record="release/${RELEASE_TAG}.integrity.json"
          VERSION="${RELEASE_TAG#v}" RELEASE_TAG="$RELEASE_TAG" RELEASE_SHA="$RELEASE_SHA" SHA256="$archive_sha256" SHA512="$archive_sha512" SIZE="$size" RECORD="$record" node -e 'const fs=require("node:fs"); const value={schema:1,package:"@telecrypt-io/storage",version:process.env.VERSION,tag:process.env.RELEASE_TAG,commit:process.env.RELEASE_SHA,tarball_sha256:`sha256:${process.env.SHA256}`,tarball_sha512:`sha512-${process.env.SHA512}`,tarball_size:Number(process.env.SIZE)}; fs.writeFileSync(process.env.RECORD,`${JSON.stringify(value)}\n`)'
          record_size="$(wc -c <"$record")"
          test "$record_size" -gt 0 -a "$record_size" -le 65536
          printf 'archive_digest=sha256:%s\narchive_size=%s\nrecord_digest=sha256:%s\nrecord_size=%s\n' "$archive_sha256" "$size" "$(sha256sum "$record" | awk '{print $1}')" "$record_size" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: storage-sdk-${{ github.run_id }}-${{ github.sha }}
          overwrite: true
          path: |
            release/${{ github.ref_name }}.tgz
            release/${{ github.ref_name }}.integrity.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: write, actions: read}
    outputs:
      release_id: ${{ steps.publish.outputs.release_id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.archive_digest }}
      EXPECTED_SIZE: ${{ needs.build.outputs.archive_size }}
      EXPECTED_RECORD_DIGEST: ${{ needs.build.outputs.record_digest }}
      EXPECTED_RECORD_SIZE: ${{ needs.build.outputs.record_size }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Download the exact tested SDK archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "storage-sdk-${GITHUB_RUN_ID}-${GITHUB_SHA}" \
            --dir release
      - name: Create or reuse the exact draft Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          if test "$config_status" != 0 -a "$config_status" != 1; then cat "$config_file"; exit "$config_status"; fi
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key"
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          verify_source() {
            local release_commit
            timeout --signal=TERM --kill-after=5s 60s git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
            test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
            release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
            test "$release_commit" = "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            test "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
            git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          }
          verify_source
          archive="release/${RELEASE_TAG}.tgz"
          test -f "$archive"
          test "$(wc -c <"$archive")" = "$EXPECTED_SIZE"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          record="release/${RELEASE_TAG}.integrity.json"
          test -f "$record"
          source scripts/capture-diagnostics.sh
          verify_record() {
            local file="$1"
            test "$(wc -c <"$file")" = "$EXPECTED_RECORD_SIZE"
            test "sha256:$(sha256sum "$file" | awk '{print $1}')" = "$EXPECTED_RECORD_DIGEST"
            EXPECTED_VERSION="${RELEASE_TAG#v}" EXPECTED_TAG="$RELEASE_TAG" EXPECTED_COMMIT="$RELEASE_SHA" EXPECTED_ARCHIVE_DIGEST="$EXPECTED_DIGEST" EXPECTED_ARCHIVE_SIZE="$EXPECTED_SIZE" node -e 'const fs=require("node:fs"),p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const keys=["commit","package","schema","tag","tarball_sha256","tarball_sha512","tarball_size","version"]; if(JSON.stringify(Object.keys(p).sort())!==JSON.stringify(keys.sort())||p.schema!==1||p.package!=="@telecrypt-io/storage"||p.version!==process.env.EXPECTED_VERSION||p.tag!==process.env.EXPECTED_TAG||p.commit!==process.env.EXPECTED_COMMIT||p.tarball_sha256!==process.env.EXPECTED_ARCHIVE_DIGEST||p.tarball_size!==Number(process.env.EXPECTED_ARCHIVE_SIZE)||typeof p.tarball_sha512!=="string"||!/^sha512-[A-Za-z0-9+/]+=*$/.test(p.tarball_sha512))process.exit(1)' "$file"
          }
          verify_record "$record"
          capture_gh() {
            local output="$1" error status
            shift
            error="$output.err"
            if run_captured "$output" "$error" 120 gh "$@"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$output" "$error"
          }
          capture_binary() {
            local output="$1" error status
            shift
            error="$output.err"
            if run_captured "$output" "$error" 120 gh "$@"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" false "$output" "$error"
          }
          replay_api_failure() {
            local body="$1" error="$2"
            shift 2
            if test -f "$body.err"; then
              replay_capture "$body" "$body.err" true "$error" "$@"
            else
              replay_capture "$body" "$error" true "$@"
            fi
          }
          api_value() {
            local body="$1" value status replay_status=0 semantic_output="$1.semantic.out"
            shift
            local error="$body.semantic.err"
            if "$@" >"$semantic_output" 2>"$error"; then
              if cat "$error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            replay_api_failure "$body" "$error" "$semantic_output" || replay_status="$?"
            return "$status"
          }
          api_expect() {
            local body="$1" expected="$2" value status
            shift 2
            if value="$(api_value "$body" "$@")"; then
              :
            else
              status="$?"
              return "$status"
            fi
            if test "$value" = "$expected"; then return 0; fi
            printf 'API semantic mismatch (expected %s, got %s)\n' "$expected" "$value" >&2
            replay_api_failure "$body" "$body.semantic.err"
            return 1
          }
          require_api_json() {
            local body="$1" transport_error="$2" status replay_status=0 semantic_output="$1.semantic.out" semantic_error="$1.semantic.err"
            shift 2
            if "$@" >"$semantic_output" 2>"$semantic_error"; then
              if cat "$semantic_error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            if test "$transport_error" = "$body.err"; then
              replay_api_failure "$body" "$semantic_error" "$semantic_output" || replay_status="$?"
            else
              replay_api_failure "$body" "$semantic_error" "$semantic_output" "$transport_error" || replay_status="$?"
            fi
            return "$status"
          }
          upload_asset() {
            local input="$1" content_type="$2" name="$3" upload_url expected_upload_url response status
            test "$name" = "${RELEASE_TAG}.tgz" -o "$name" = "${RELEASE_TAG}.integrity.json"
            upload_url="$(api_value "$probe" jq -er '.upload_url | sub("\\{\\?name,label\\}$"; "")' "$probe")"
            expected_upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
            if test "$upload_url" != "$expected_upload_url"; then
              printf 'API semantic mismatch (unexpected upload URL)\n' >&2
              replay_api_failure "$probe" "$probe.semantic.err"
              return 1
            fi
            response="$RUNNER_TEMP/storage-sdk-upload-${name}.json"
            if run_captured "$response" "$response.err" 120 curl --proto '=https' --tlsv1.2 --show-error --fail-with-body --max-time 120 --connect-timeout 20 --request POST --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2026-03-10' --header "Content-Type: $content_type" --data-binary "@$input" "$upload_url?name=$name"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$response" "$response.err"
          }
          verify_draft() {
            local json="$1" id="$2"
            require_api_json "$json" "$json.err" jq -e --arg id "$id" --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); (.id|tostring)==$id and .tag_name==$tag and .name==$tag and .body==("Release "+$tag) and .target_commitish==$target and .draft==true and .prerelease==false and (.immutable==false or .immutable==null) and (.created_at|iso) and .published_at==null and ((.assets|type)=="array")' "$json"
          }
          revalidate_draft_for_publish() {
            local json="$1" id="$2"
            capture_gh "$json" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$id"
            verify_draft "$json" "$id"
            api_expect "$json" "$expected_draft_asset_metadata" jq -c '[.assets[] | {id,name,state,size,digest}] | sort_by(.name)' "$json"
            require_api_json "$json" "$json.err" jq -e --arg tag "$RELEASE_TAG" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" --arg record_digest "$EXPECTED_RECORD_DIGEST" --argjson record_size "$EXPECTED_RECORD_SIZE" '((.assets|type)=="array" and (.assets|length)==2) and all(.assets[]; type=="object" and (.id|type=="number" and . > 0 and floor==.) and .state=="uploaded") and (any(.assets[]; .name==($tag+".tgz") and .size==$size and .digest==$digest)) and (any(.assets[]; .name==($tag+".integrity.json") and .size==$record_size and .digest==$record_digest))' "$json"
          }
          verify_published() {
            local json="$1" id="$2"
            require_api_json "$json" "$json.err" jq -e --arg id "$id" --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" --arg record_digest "$EXPECTED_RECORD_DIGEST" --argjson record_size "$EXPECTED_RECORD_SIZE" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); (.id|tostring)==$id and .tag_name==$tag and .name==$tag and .body==("Release "+$tag) and .target_commitish==$target and .draft==false and .prerelease==false and .immutable==true and (.created_at|iso) and (.published_at|iso) and ((.published_at|fromdateiso8601) >= (.created_at|fromdateiso8601)) and ((.assets|type) == "array" and (.assets|length)==2) and (any(.assets[]; .name==($tag+".tgz") and .state=="uploaded" and .size==$size and .digest==$digest)) and (any(.assets[]; .name==($tag+".integrity.json") and .state=="uploaded" and .size==$record_size and .digest==$record_digest))' "$json"
          }
          download_asset() {
            local json="$1" output="$2" name="$3" asset_id
            asset_id="$(api_value "$json" jq -er --arg name "$name" '.assets[] | select(.name==$name) | .id | select(type=="number" and .>0 and floor==.)' "$json")"
            capture_binary "$output" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            if test "$name" = "${RELEASE_TAG}.tgz"; then
              test "$(wc -c <"$output")" = "$EXPECTED_SIZE"
              test "sha256:$(sha256sum "$output" | awk '{print $1}')" = "$EXPECTED_DIGEST"
              cmp -s "$archive" "$output"
              verify_archive "$output"
            else
              verify_record "$output"
            fi
          }
          verify_archive() {
            local file="$1" listing="$RUNNER_TEMP/sdk-archive-list" status
            local package_files=".github/package-files.txt"
            test -f "$package_files"
            if run_captured "$listing" "$listing.err" 60 tar -tzf "$file"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$listing" "$listing.err"
            test "$status" = 0
            test "$(sort "$listing")" = "$(sort "$package_files")"
            if grep -Eq '(^|/)node_modules(/|$)' "$listing"; then exit 1; fi
            if run_captured "$listing.license" "$listing.license.err" 60 tar -xOf "$file" package/LICENSE; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$listing.license" "$listing.license.err"
            test "$status" = 0
            cmp -s "$listing.license" LICENSE
            test "$(tar -xOf "$file" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')" = "${RELEASE_TAG#v}"
          }
          release_list_raw="$RUNNER_TEMP/release-list.raw.json"
          release_list="$RUNNER_TEMP/release-list.jsonl"
          capture_gh "$release_list_raw" api --paginate --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases?per_page=100"
          api_value "$release_list_raw" jq -c -s 'map(.[])[] | {id,tag_name,draft}' "$release_list_raw" >"$release_list"
          require_api_json "$release_list_raw" "$release_list_raw.err" jq -e -s 'all(.[]; type == "object" and ((keys | sort) == ["draft", "id", "tag_name"]) and (.id | type == "number" and . > 0 and floor == .) and (.tag_name | type == "string" and length > 0) and (.draft | type == "boolean"))' "$release_list"
          release_matches="$RUNNER_TEMP/release-matches.json"
          api_value "$release_list_raw" jq -e -s --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]' "$release_list" >"$release_matches"
          match_count="$(api_value "$release_list_raw" jq -er 'length' "$release_matches")"
          require_api_json "$release_list_raw" "$release_list_raw.err" test "$match_count" = 0 -o "$match_count" = 1
          probe="$RUNNER_TEMP/release-probe.json"
          case "$match_count" in
            0)
              create="$RUNNER_TEMP/release-create.json"
              verify_source
              capture_gh "$create" api --hostname github.com --method POST --header 'X-GitHub-Api-Version: 2026-03-10' --raw-field "tag_name=$RELEASE_TAG" --raw-field "name=$RELEASE_TAG" --raw-field "body=Release $RELEASE_TAG" --raw-field "target_commitish=$RELEASE_SHA" --field draft=true --field prerelease=false "/repos/$GITHUB_REPOSITORY/releases"
              release_id="$(api_value "$create" jq -er '.id | select(type=="number" and .>0 and floor==.)' "$create")"
              capture_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              ;;
            1)
              release_id="$(api_value "$release_list_raw" jq -er '.[0].id | select(type=="number" and .>0 and floor==.)' "$release_matches")"
              capture_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              ;;
            *)
              echo "Release catalog contains multiple entries for the exact tag" >&2
              exit 1
              ;;
          esac
          state="$(api_value "$probe" jq -er 'if .draft==true then "draft" elif .draft==false then "published" else empty end' "$probe")"
          case "$state" in
            draft)
              verify_draft "$probe" "$release_id"
              require_api_json "$probe" "$probe.err" jq -e '(.assets|type == "array") and all(.assets[]; type == "object" and (.id|type == "number" and . > 0 and floor == .))' "$probe"
              asset_ids="$RUNNER_TEMP/release-assets"
              api_value "$probe" jq -r '.assets[]?.id // empty' "$probe" >"$asset_ids"
              while IFS= read -r asset_id; do
                test -z "$asset_id" || [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
                if test -n "$asset_id"; then
                  verify_source
                  capture_gh "$RUNNER_TEMP/delete-$asset_id.json" api --hostname github.com --method DELETE --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                fi
              done <"$asset_ids"
              asset_name="${RELEASE_TAG}.tgz"
              verify_source
                  upload_asset "$archive" application/octet-stream "$asset_name"
              record_name="${RELEASE_TAG}.integrity.json"
              verify_source
                  upload_asset "$record" application/json "$record_name"
              capture_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              verify_draft "$probe" "$release_id"
              require_api_json "$probe" "$probe.err" jq -e --arg tag "$RELEASE_TAG" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" --arg record_digest "$EXPECTED_RECORD_DIGEST" --argjson record_size "$EXPECTED_RECORD_SIZE" '((.assets|length)==2) and (any(.assets[]; .name==($tag+".tgz") and .state=="uploaded" and .size==$size and .digest==$digest)) and (any(.assets[]; .name==($tag+".integrity.json") and .state=="uploaded" and .size==$record_size and .digest==$record_digest))' "$probe"
              expected_draft_asset_metadata="$(api_value "$probe" jq -c '[.assets[] | {id,name,state,size,digest}] | sort_by(.name)' "$probe")"
              download_asset "$probe" "$RUNNER_TEMP/draft.tgz" "$asset_name"
              download_asset "$probe" "$RUNNER_TEMP/draft.integrity.json" "$record_name"
              # Revalidate the authoritative tag and current main immediately before the one publish mutation.
              verify_source
              revalidate_draft_for_publish "$probe" "$release_id"
              capture_gh "$RUNNER_TEMP/published.json" api --hostname github.com --method PATCH --header 'X-GitHub-Api-Version: 2026-03-10' --field draft=false "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              capture_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              verify_published "$probe" "$release_id"
              download_asset "$probe" "$RUNNER_TEMP/published.tgz" "$asset_name"
              download_asset "$probe" "$RUNNER_TEMP/published.integrity.json" "$record_name"
              ;;
            published)
              # Only an exact immutable Release is recoverable on a rerun after downstream failure.
              test "${GITHUB_RUN_ATTEMPT:-1}" -gt 1
              verify_published "$probe" "$release_id"
              asset_name="${RELEASE_TAG}.tgz"
              record_name="${RELEASE_TAG}.integrity.json"
              download_asset "$probe" "$RUNNER_TEMP/published.tgz" "$asset_name"
              download_asset "$probe" "$RUNNER_TEMP/published.integrity.json" "$record_name"
              ;;
            *)
              echo "Release state is neither draft nor published" >&2
              exit 1
              ;;
          esac
          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"

  publish:
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      EXPECTED_RELEASE_ID: ${{ needs.release.outputs.release_id }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.archive_digest }}
      EXPECTED_SIZE: ${{ needs.build.outputs.archive_size }}
      EXPECTED_RECORD_DIGEST: ${{ needs.build.outputs.record_digest }}
      EXPECTED_RECORD_SIZE: ${{ needs.build.outputs.record_size }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Download the exact tested SDK archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "storage-sdk-${GITHUB_RUN_ID}-${GITHUB_SHA}" \
            --dir release
      - uses: actions/setup-node@v7.0.0
        with: {node-version: "24.20.0", registry-url: https://registry.npmjs.org}
      - name: Verify the exact Trusted Publishing toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          test "$(npm --version)" = 11.19.0
      - name: Verify the immutable Release and publish the exact archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/capture-diagnostics.sh
          archive="release/${RELEASE_TAG}.tgz"
          test "$(wc -c <"$archive")" = "$EXPECTED_SIZE"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          capture_binary() {
            local output="$1" error status
            shift
            error="$output.err"
            if run_captured "$output" "$error" 120 gh "$@"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" false "$output" "$error"
          }
          capture_response() {
            local output="$1" error status
            shift
            error="$output.err"
            if run_captured "$output" "$error" 120 gh "$@"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$output" "$error"
          }
          replay_api_failure() {
            local body="$1" error="$2"
            shift 2
            if test -f "$body.err"; then
              replay_capture "$body" "$body.err" true "$error" "$@"
            else
              replay_capture "$body" "$error" true "$@"
            fi
          }
          api_value() {
            local body="$1" value status replay_status=0 semantic_output="$1.semantic.out"
            shift
            local error="$body.semantic.err"
            if "$@" >"$semantic_output" 2>"$error"; then
              if cat "$error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            replay_api_failure "$body" "$error" "$semantic_output" || replay_status="$?"
            return "$status"
          }
          require_api_json() {
            local body="$1" transport_error="$2" status replay_status=0 semantic_output="$1.semantic.out" semantic_error="$1.semantic.err"
            shift 2
            if "$@" >"$semantic_output" 2>"$semantic_error"; then
              if cat "$semantic_error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            if test "$transport_error" = "$body.err"; then
              replay_api_failure "$body" "$semantic_error" "$semantic_output" || replay_status="$?"
            else
              replay_api_failure "$body" "$semantic_error" "$semantic_output" "$transport_error" || replay_status="$?"
            fi
            return "$status"
          }
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          if test "$config_status" != 0 -a "$config_status" != 1; then cat "$config_file"; exit "$config_status"; fi
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key"
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          verify_source() {
            local release_commit
            timeout --signal=TERM --kill-after=5s 60s git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
            test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
            release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
            test "$release_commit" = "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            test "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
            git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          }
          verify_archive() {
            local file="$1" listing="$RUNNER_TEMP/sdk-publish-archive-list" status
            local package_files=".github/package-files.txt"
            test -f "$package_files"
            if run_captured "$listing" "$listing.err" 60 tar -tzf "$file"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$listing" "$listing.err"
            test "$status" = 0
            test "$(sort "$listing")" = "$(sort "$package_files")"
            if grep -Eq '(^|/)node_modules(/|$)' "$listing"; then exit 1; fi
            if run_captured "$listing.license" "$listing.license.err" 60 tar -xOf "$file" package/LICENSE; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$listing.license" "$listing.license.err"
            test "$status" = 0
            cmp -s "$listing.license" LICENSE
            test "$(tar -xOf "$file" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')" = "${RELEASE_TAG#v}"
          }
          verify_record() {
            local file="$1" version
            version="$(printf '%s' "$RELEASE_TAG" | cut -c 2-)"
            test "$(wc -c <"$file")" = "$EXPECTED_RECORD_SIZE"
            test "sha256:$(sha256sum "$file" | awk '{print $1}')" = "$EXPECTED_RECORD_DIGEST"
            jq -e --arg version "$version" --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" 'keys == ["commit","package","schema","tag","tarball_sha256","tarball_sha512","tarball_size","version"] and .schema == 1 and .package == "@telecrypt-io/storage" and .version == $version and .tag == $tag and .commit == $commit and .tarball_sha256 == $digest and (.tarball_sha512 | type == "string" and test("^sha512-[A-Za-z0-9+/]+=*$")) and .tarball_size == $size' "$file"
          }
          record="release/$RELEASE_TAG.integrity.json"
          verify_record "$record"
          json="$RUNNER_TEMP/release.json"
          capture_response "$json" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID"
          asset_name="$RELEASE_TAG.tgz"
          record_name="$RELEASE_TAG.integrity.json"
          require_api_json "$json" "$json.err" jq -e --arg id "$EXPECTED_RELEASE_ID" --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" --arg name "$asset_name" --arg record_name "$record_name" --arg digest "$EXPECTED_DIGEST" --argjson size "$EXPECTED_SIZE" --arg record_digest "$EXPECTED_RECORD_DIGEST" --argjson record_size "$EXPECTED_RECORD_SIZE" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); (.id|tostring)==$id and .tag_name==$tag and .name==$tag and .body==("Release "+$tag) and .target_commitish==$target and .draft==false and .prerelease==false and .immutable==true and (.created_at|iso) and (.published_at|iso) and ((.published_at|fromdateiso8601) >= (.created_at|fromdateiso8601)) and ((.assets|type)=="array" and (.assets|length)==2) and (any(.assets[]; .name==$name and .state=="uploaded" and .size==$size and .digest==$digest)) and (any(.assets[]; .name==$record_name and .state=="uploaded" and .size==$record_size and .digest==$record_digest))' "$json"
          asset_id="$(api_value "$json" jq -er --arg name "$asset_name" '.assets[] | select(.name==$name) | .id | select(type=="number" and .>0 and floor==.)' "$json")"
          downloaded="$RUNNER_TEMP/downloaded.tgz"
          capture_binary "$downloaded" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          test "$(wc -c <"$downloaded")" = "$EXPECTED_SIZE"
          test "sha256:$(sha256sum "$downloaded" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          cmp -s "$archive" "$downloaded"
          verify_archive "$downloaded"
          record_id="$(api_value "$json" jq -er --arg name "$record_name" '.assets[] | select(.name==$name) | .id | select(type=="number" and .>0 and floor==.)' "$json")"
          downloaded_record="$RUNNER_TEMP/downloaded.integrity.json"
          capture_binary "$downloaded_record" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$record_id"
          verify_record "$downloaded_record"
          version="${RELEASE_TAG#v}"
          registry_status="$RUNNER_TEMP/npm-registry.status"
          registry_body="$RUNNER_TEMP/npm-registry.body"
          registry_err="$registry_body.err"
          capture_extra_paths=("$registry_body")
          if run_captured "$registry_status" "$registry_err" 120 curl --proto '=https' --tlsv1.2 --show-error --max-time 120 --connect-timeout 20 --output "$registry_body" --write-out '%{http_code}' "https://registry.npmjs.org/@telecrypt-io%2fstorage/$version"; then registry_curl_status=0; else registry_curl_status="$?"; fi
          capture_extra_paths=()
          registry_replay_status=0
          if test "$registry_curl_status" -ne 0; then
            replay_capture "$registry_status" "$registry_err" true "$registry_body" || registry_replay_status="$?"
          else
            replay_capture "$registry_status" "$registry_err" false || registry_replay_status="$?"
          fi
          if test "$registry_curl_status" -eq 0 && test "$registry_replay_status" -ne 0; then exit "$registry_replay_status"; fi
          test "$registry_curl_status" = 0
          test "$(wc -c <"$registry_status")" = 3
          http_status="$(cat "$registry_status")"
          [[ "$http_status" =~ ^[0-9]{3}$ ]]
          case "$http_status" in
            404)
            verify_source
            publish_out="$RUNNER_TEMP/npm-publish.out"
            publish_err="$publish_out.err"
            if run_captured "$publish_out" "$publish_err" 120 npm publish "./$archive" --access public --provenance --ignore-scripts; then publish_status=0; else publish_status="$?"; fi
            if test "$publish_status" != 0; then
              replay_capture "$publish_out" "$publish_err"
              exit "$publish_status"
            fi
            if replay_capture "$publish_out" "$publish_err" false; then :; else
              replay_status="$?"
              exit "$replay_status"
            fi
            if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$publish_out" "$publish_err"; then
              replay_capture "$publish_out" "$publish_err"
              exit 1
            fi
            ;;
            200)
            ;;
            *)
            replay_capture "$registry_body" "$registry_err"
            echo "Unexpected npm registry status: $http_status" >&2
            exit 1
            ;;
          esac
      - name: Verify npm registry bytes, integrity, and provenance
        env:
          PACKAGE_NAME: "@telecrypt-io/storage"
        shell: bash
        run: |
          set -euo pipefail
          source scripts/capture-diagnostics.sh
          version="${RELEASE_TAG#v}"
          package="$PACKAGE_NAME@$version"
          archive="release/${RELEASE_TAG}.tgz"
          record="release/$RELEASE_TAG.integrity.json"
          d="$RUNNER_TEMP/npm-registry"
          mkdir -p "$d"
          replay_api_failure() {
            local body="$1" error="$2"
            shift 2
            if test -f "$body.err"; then
              replay_capture "$body" "$body.err" true "$error" "$@"
            else
              replay_capture "$body" "$error" true "$@"
            fi
          }
          api_value() {
            local body="$1" value status replay_status=0 semantic_output="$1.semantic.out"
            shift
            local error="$body.semantic.err"
            if "$@" >"$semantic_output" 2>"$error"; then
              if cat "$error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            replay_api_failure "$body" "$error" "$semantic_output" || replay_status="$?"
            return "$status"
          }
          require_api_json() {
            local body="$1" transport_error="$2" status replay_status=0 semantic_output="$1.semantic.out" semantic_error="$1.semantic.err"
            shift 2
            if "$@" >"$semantic_output" 2>"$semantic_error"; then
              if cat "$semantic_error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            if test "$transport_error" = "$body.err"; then
              replay_api_failure "$body" "$semantic_error" "$semantic_output" || replay_status="$?"
            else
              replay_api_failure "$body" "$semantic_error" "$semantic_output" "$transport_error" || replay_status="$?"
            fi
            return "$status"
          }
          registry_retry() {
            local semantic_verify=false output error status semantic_status retry_window_seconds retry_interval_seconds retry_deadline attempt attempt_output attempt_error attempt_semantic_output attempt_semantic_error replay_failed=0
            if test "$1" = "--verify-provenance"; then
              semantic_verify=true
              shift
            fi
            output="$1"
            error="$2"
            shift 2
            # npm may expose package metadata before its attestation index; retry only these safe reads.
            retry_window_seconds=300
            retry_interval_seconds=10
            retry_deadline=$((SECONDS + retry_window_seconds))
            attempt=0
            mkdir -p "$output.attempts"
            while :; do
              attempt=$((attempt + 1))
              attempt_output="$output.attempts/$attempt.out"
              attempt_error="$output.attempts/$attempt.err"
              semantic_status=""
              if run_captured "$attempt_output" "$attempt_error" 120 "$@"; then status=0; else status="$?"; fi
              cp "$attempt_output" "$output"
              cp "$attempt_error" "$error"
              if test "$status" = 0; then
                if test "$semantic_verify" = true; then
                  attempt_semantic_output="$attempt_output.verify"
                  attempt_semantic_error="$attempt_semantic_output.err"
                  if run_captured "$attempt_semantic_output" "$attempt_semantic_error" 120 node scripts/verify-npm-provenance.mjs --dist "$d/dist.json" --attestations "$output" --archive "$archive" --package "$PACKAGE_NAME" --version "$version" --tag "$RELEASE_TAG" --commit "$RELEASE_SHA"; then semantic_status=0; else semantic_status="$?"; fi
                  if test "$semantic_status" = 0; then
                    if test -s "$attempt_error"; then cat "$attempt_error" >&2; fi
                    if test -s "$attempt_semantic_error"; then cat "$attempt_semantic_error" >&2; fi
                    if test "$replay_failed" -ne 0; then return 1; fi
                    return 0
                  fi
                  if replay_capture "$attempt_output" "$attempt_error" true "$attempt_semantic_output" "$attempt_semantic_error"; then :; else replay_failed=1; fi
                  if ! grep -Fq 'attestations document must contain exactly two statements' "$attempt_semantic_error"; then
                    return "$semantic_status"
                  fi
                else
                  if replay_capture "$attempt_output" "$attempt_error"; then :; else replay_failed=1; fi
                  if test -s "$attempt_error"; then cat "$attempt_error" >&2; fi
                  if test "$replay_failed" -ne 0; then return 1; fi
                  return 0
                fi
              else
                if replay_capture "$attempt_output" "$attempt_error"; then :; else replay_failed=1; fi
              fi
              if (( SECONDS >= retry_deadline )); then
                if test "$semantic_verify" = true && test -n "$semantic_status"; then return "$semantic_status"; fi
                return "$status"
              fi
              sleep "$retry_interval_seconds"
            done
          }
          registry_retry "$d/dist.json" "$d/dist.err" npm view "$package" dist --json
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$d/dist.json" "$d/dist.err"; then
            replay_capture "$d/dist.json" "$d/dist.err"
            exit 1
          fi
          require_api_json "$d/dist.json" "$d/dist.err" node - "$d/dist.json" "$archive" <<'NODE'
          const fs = require("node:fs"), crypto = require("node:crypto");
          const dist = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const bytes = fs.readFileSync(process.argv[3]);
          if (typeof dist.tarball !== "string" || !/^https:\/\/registry\.npmjs\.org\//.test(dist.tarball)) process.exit(1);
          if (typeof dist.integrity !== "string" || dist.integrity !== `sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`) process.exit(1);
          if (!dist.attestations || typeof dist.attestations.url !== "string" || !dist.attestations.url) process.exit(1);
          NODE
          attestations_url="$(api_value "$d/dist.json" node - "$d/dist.json" "$PACKAGE_NAME" "$version" <<'NODE'
          const fs = require("node:fs");
          const dist = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const packageName = process.argv[3];
          const version = process.argv[4];
          const expected = `https://registry.npmjs.org/-/npm/v1/attestations/${packageName.replaceAll("/", "%2f")}@${version}`;
          let parsed;
          try { parsed = new URL(dist.attestations.url); } catch { process.exit(1); }
          if (dist.attestations.url !== expected || parsed.protocol !== "https:" || parsed.hostname !== "registry.npmjs.org" || parsed.username || parsed.password || parsed.port || parsed.search || parsed.hash) process.exit(1);
          process.stdout.write(parsed.toString());
          NODE
          )"
          registry_retry --verify-provenance "$d/attestations.json" "$d/attestations.err" curl --proto '=https' --tlsv1.2 --show-error --fail-with-body --max-time 120 --connect-timeout 20 "$attestations_url"
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$d/attestations.json" "$d/attestations.err"; then
            replay_capture "$d/attestations.json" "$d/attestations.err"
            exit 1
          fi
          require_api_json "$d/dist.json" "$d/dist.err" node - "$d/dist.json" "$archive" "$record" <<'NODE'
          const fs = require("node:fs"), crypto = require("node:crypto");
          const dist = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const bytes = fs.readFileSync(process.argv[3]);
          const record = JSON.parse(fs.readFileSync(process.argv[4], "utf8"));
          if (dist.integrity !== record.tarball_sha512 || record.tarball_sha256 !== "sha256:" + crypto.createHash("sha256").update(bytes).digest("hex")) process.exit(1);
          NODE
          if run_captured "$d/pack.json" "$d/pack.err" 120 npm pack "$package" --ignore-scripts --pack-destination "$d" --json; then status=0; else status="$?"; fi
          finish_capture "$status" true "$d/pack.json" "$d/pack.err"
          test "$status" = 0
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$d/pack.json" "$d/pack.err"; then
            replay_capture "$d/pack.json" "$d/pack.err"
            exit 1
          fi
          mapfile -t packed < <(find "$d" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#packed[@]}" = 1
          cmp -s "$archive" "${packed[0]}"
          audit="$RUNNER_TEMP/npm-signature-check"
          mkdir -p "$audit"
          printf '{"name":"npm-signature-check","private":true,"dependencies":{"%s":"%s"}}\n' "$PACKAGE_NAME" "$version" >"$audit/package.json"
          audit_install_out="$d/audit-install.out"
          audit_install_err="$audit_install_out.err"
          if run_captured "$audit_install_out" "$audit_install_err" 300 bash -c 'cd "$1" && npm install --ignore-scripts --no-fund --no-audit' bash "$audit"; then status=0; else status="$?"; fi
          finish_capture "$status" true "$audit_install_out" "$audit_install_err"
          test "$status" = 0
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$audit_install_out" "$audit_install_err"; then
            replay_capture "$audit_install_out" "$audit_install_err"
            exit 1
          fi
          audit_out="$d/audit.out"
          audit_err="$audit_out.err"
          if run_captured "$audit_out" "$audit_err" 300 bash -c 'cd "$1" && npm audit signatures' bash "$audit"; then status=0; else status="$?"; fi
          finish_capture "$status" true "$audit_out" "$audit_err"
          test "$status" = 0
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$audit_out" "$audit_err"; then
            replay_capture "$audit_out" "$audit_err"
            exit 1
          fi
          require_capture "$audit_out" "$audit_err" test -s "$audit_out"
          require_capture "$audit_out" "$audit_err" grep -Eqi 'verified attestations?' "$audit_out"
          verify_out="$d/provenance.out"
          verify_err="$verify_out.err"
          if run_captured "$verify_out" "$verify_err" 120 node scripts/verify-npm-provenance.mjs --dist "$d/dist.json" --attestations "$d/attestations.json" --archive "$archive" --package "$PACKAGE_NAME" --version "$version" --tag "$RELEASE_TAG" --commit "$RELEASE_SHA"; then status=0; else status="$?"; fi
          finish_capture "$status" true "$verify_out" "$verify_err"
          test "$status" = 0
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$verify_out" "$verify_err"; then
            replay_capture "$verify_out" "$verify_err"
            exit 1
          fi
          require_capture "$verify_out" "$verify_err" grep -Fq 'verified npm provenance' "$verify_out"
