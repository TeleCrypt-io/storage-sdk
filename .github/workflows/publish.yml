name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: storage-sdk-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Check the release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          npm_version="$(node -p 'require("./package.json").packageManager?.replace(/^npm@/u, "")')"
          test -n "$npm_version"
          test "$(npm --version)" = "$npm_version"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const version = process.env.GITHUB_REF_NAME.slice(1);
          if (manifest.name !== "@telecrypt-io/storage" || manifest.version !== version ||
              lock.name !== manifest.name || lock.packages?.[""]?.version !== version) {
            throw new Error("tag, package, and lockfile versions must match");
          }
          NODE

      - name: Install, test, and build
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run lint
          npm run test:unit
          npm run build

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      - name: Publish the package
        run: npm publish --ignore-scripts
