name: Publish to npm

# Publishes @telecrypt-io/storage to the npm registry using npm Trusted
# Publishing (OIDC) with provenance. There is no NODE_AUTH_TOKEN or npm token;
# npm trusts this repository's exact workflow identity.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_CONFIG_KEY_1: advice.detachedHead
      GIT_CONFIG_VALUE_1: "false"
    permissions:
      id-token: write # required to mint the OIDC token trusted publishing exchanges for a publish credential
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated immutable release tag
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag

      - name: Require release commit to be contained in refreshed main
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Require a tag matching the package version
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -e 'console.log(require("./package.json").version)')"
          test "$expected_version" = "$package_version"

      # Pin a Trusted-Publishing-capable npm instead of relying on Node's bundled version.
      - name: Ensure a trusted-publishing-capable npm
        run: npm install -g npm@11.5.1 --no-fund

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Verify and build
        run: |
          npm run lint
          npm run test:unit
          npm run build

      - name: Publish (OIDC trusted publishing + provenance)
        # The registry emits a token-policy notice even for OIDC publishing;
        # warn level retains warnings and errors while hiding notice-level output.
        run: npm publish --access public --provenance --loglevel=warn
