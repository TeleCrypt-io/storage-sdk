name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify the exact Node.js and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p 'require("./package.json").packageManager.replace(/^npm@/u, "")')"
          test "$(npm --version)" = "$npm_version"
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
