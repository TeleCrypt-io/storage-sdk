name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CONFIG_COUNT: "0"
      GIT_CONFIG_PARAMETERS: ""
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /bin/false
      SSH_ASKPASS: /bin/false
      GIT_ALLOW_PROTOCOL: https
      GIT_PROTOCOL_FROM_USER: "0"
      GH_HOST: github.com
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check immutable publication workflow invariants
        run: python3 .github/workflows/publish-static-test.py
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Verify the exact Node.js and npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install and verify the SDK with bounded diagnostics
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 524288 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 524288 -a "$(wc -c <"$error")" -le 524288
            test "$status" = 0
            test ! -s "$error"
            ! rg -qi '\bwarn(ing)?\b' "$output" "$error"
          }
          bounded_command "$RUNNER_TEMP/npm-ci.out" 600 npm ci --ignore-scripts --no-fund --no-audit --loglevel=error
          bounded_command "$RUNNER_TEMP/npm-lint.out" 300 npm run lint
          bounded_command "$RUNNER_TEMP/npm-test-unit.out" 600 npm run test:unit
          bounded_command "$RUNNER_TEMP/npm-build.out" 300 npm run build
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-bounded-command.py
